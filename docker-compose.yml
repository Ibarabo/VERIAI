version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: veriai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-veriai-production-secure-key-africa-2026}
      - CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000"]
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veriai-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
