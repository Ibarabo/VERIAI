# fly.toml app configuration file for VeriAI Africa FastAPI Backend
app = "veriai-africa-backend"
primary_region = "lhr"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  APP_ENV = "production"
  DEBUG = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/v1/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
